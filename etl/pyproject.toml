[project]
name = "esg-etl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

# Sem isto, o setuptools ve 'esg_etl' e 'data' no topo, nao sabe qual e o
# pacote e aborta a instalacao.
[tool.setuptools]
packages = ["esg_etl"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
